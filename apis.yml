name: Lucira Health
description: >-
  Lucira Health (formerly Diassess Inc.) was a molecular diagnostics company based in
  Emeryville, California that developed single-use, disposable RT-LAMP test kits designed
  for at-home use. Its Lucira COVID-19 All-In-One Test Kit received the first FDA Emergency
  Use Authorization for an over-the-counter at-home molecular COVID-19 test, and the company
  later introduced the first at-home combination COVID-19 and influenza (flu) test. Lucira
  Health filed for Chapter 11 bankruptcy in February 2023 and its assets were subsequently
  acquired by Pfizer. The company is a consumer medical-device and diagnostics business; it
  published no public developer API, developer portal, or machine-readable API specification.
  This profile is maintained in the API Evangelist network as a company record; the legacy
  lucirahealth.com domain is now managed under Pfizer's email/DNS infrastructure and no longer
  serves a working web presence.
